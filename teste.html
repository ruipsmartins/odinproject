<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Reading App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .add-book-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
        }
        
        button {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .book-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .book-card h3 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .book-card p {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        
        .book-card .author {
            color: #667eea;
            font-weight: 600;
        }
        
        .empty-state {
            text-align: center;
            color: white;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 My Reading Tracker</h1>
            <p>Keep track of all the books you've read</p>
        </header>
        
        <div class="add-book-section">
            <h2>Add a Book You've Read</h2>
            <form id="bookForm">
                <div class="form-group">
                    <label for="title">Book Title</label>
                    <input type="text" id="title" placeholder="Enter book title" required>
                </div>
                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" placeholder="Enter author name" required>
                </div>
                <div class="form-group">
                    <label for="year">Year Completed</label>
                    <input type="number" id="year" placeholder="2024" min="1900" max="2099">
                </div>
                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" placeholder="Add your thoughts about the book..." rows="3"></textarea>
                </div>
                <button type="submit">Add Book</button>
            </form>
        </div>
        
        <div id="booksContainer" class="books-grid"></div>
        <div id="emptyState" class="empty-state">
            <p>No books added yet. Start adding your completed reads!</p>
        </div>
    </div>
</body>
</html>
